name: CD

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deployment
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate deployment configuration
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_ALLOWED_HOSTS: ${{ secrets.DJANGO_ALLOWED_HOSTS }}
          DJANGO_CSRF_TRUSTED_ORIGINS: ${{ secrets.DJANGO_CSRF_TRUSTED_ORIGINS }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DJANGO_SUPERUSER_USERNAME: ${{ secrets.DJANGO_SUPERUSER_USERNAME }}
          DJANGO_SUPERUSER_PASSWORD: ${{ secrets.DJANGO_SUPERUSER_PASSWORD }}
        run: |
          required=(
            SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS
            DJANGO_SECRET_KEY DJANGO_ALLOWED_HOSTS DJANGO_CSRF_TRUSTED_ORIGINS
            POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD
            DJANGO_SUPERUSER_USERNAME DJANGO_SUPERUSER_PASSWORD
          )
          for variable_name in "${required[@]}"; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "Required GitHub secret is missing: $variable_name" >&2
              exit 1
            fi
          done

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Render production env
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_ALLOWED_HOSTS: ${{ secrets.DJANGO_ALLOWED_HOSTS }}
          DJANGO_CSRF_TRUSTED_ORIGINS: ${{ secrets.DJANGO_CSRF_TRUSTED_ORIGINS }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DJANGO_SUPERUSER_USERNAME: ${{ secrets.DJANGO_SUPERUSER_USERNAME }}
          DJANGO_SUPERUSER_EMAIL: ${{ secrets.DJANGO_SUPERUSER_EMAIL }}
          DJANGO_SUPERUSER_PASSWORD: ${{ secrets.DJANGO_SUPERUSER_PASSWORD }}
          DATA_TOOLS_PASSWORD: ${{ secrets.DATA_TOOLS_PASSWORD }}
          APP_PORT: ${{ vars.APP_PORT || '8000' }}
          TRUSTED_PROXY_COUNT: ${{ vars.TRUSTED_PROXY_COUNT || '1' }}
          DB_CONN_MAX_AGE: ${{ vars.DB_CONN_MAX_AGE || '60' }}
          CACHE_DEFAULT_TIMEOUT: ${{ vars.CACHE_DEFAULT_TIMEOUT || '300' }}
          CACHE_KEY_PREFIX: ${{ vars.CACHE_KEY_PREFIX || 'cadet-journal' }}
          REDIS_MAXMEMORY: ${{ vars.REDIS_MAXMEMORY || '256mb' }}
          REDIS_MAXMEMORY_POLICY: ${{ vars.REDIS_MAXMEMORY_POLICY || 'allkeys-lru' }}
          WEB_CONCURRENCY: ${{ vars.WEB_CONCURRENCY || '3' }}
          WEB_TIMEOUT_KEEP_ALIVE: ${{ vars.WEB_TIMEOUT_KEEP_ALIVE || '5' }}
          WEB_LOG_LEVEL: ${{ vars.WEB_LOG_LEVEL || 'info' }}
          WEB_ACCESS_LOG: ${{ vars.WEB_ACCESS_LOG || '1' }}
          DB_WAIT_TIMEOUT: ${{ vars.DB_WAIT_TIMEOUT || '60' }}
          DEPLOY_WAIT_TIMEOUT: ${{ vars.DEPLOY_WAIT_TIMEOUT || '240' }}
          BACKUP_INTERVAL_SECONDS: ${{ vars.BACKUP_INTERVAL_SECONDS || '86400' }}
          BACKUP_RETENTION_DAYS: ${{ vars.BACKUP_RETENTION_DAYS || '30' }}
        run: python scripts/render_prod_env.py --output "$RUNNER_TEMP/cadet-journal.env"

      - name: Upload env and deploy verified SHA
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          APP_DIR: ${{ vars.APP_DIR || '/opt/cadet_journal' }}
          REPO_CLONE_URL: ${{ vars.REPO_CLONE_URL || format('https://github.com/{0}.git', github.repository) }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          remote_env="/tmp/cadet-journal-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.env"
          ssh_options=(
            -i ~/.ssh/id_ed25519
            -p "$SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=20
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
          )

          scp -i ~/.ssh/id_ed25519 \
            -P "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "$RUNNER_TEMP/cadet-journal.env" \
            "$SSH_USER@$SSH_HOST:$remote_env"

          printf -v remote_command \
            'APP_DIR=%q REPO_CLONE_URL=%q DEPLOY_SHA=%q ENV_UPLOAD_PATH=%q bash -s' \
            "$APP_DIR" "$REPO_CLONE_URL" "$DEPLOY_SHA" "$remote_env"

          ssh "${ssh_options[@]}" \
            "$SSH_USER@$SSH_HOST" \
            "$remote_command" < scripts/remote-deploy.sh
