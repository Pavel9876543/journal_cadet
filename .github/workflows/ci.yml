name: CI

on:
  push:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DJANGO_ENV: test
  DJANGO_ENV_FILE: .env.test
  DB_ENGINE: django.db.backends.postgresql
  DB_NAME: journal_test
  DB_USER: journal
  DB_PASSWORD: journal
  DB_HOST: 127.0.0.1
  DB_PORT: "5432"

jobs:
  test:
    name: Django and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: journal_test
          POSTGRES_USER: journal
          POSTGRES_PASSWORD: journal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U journal -d journal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Validate env examples
        run: |
          python scripts/validate_env.py \
            --file .env.prod.example \
            --environment production \
            --allow-placeholders
          python scripts/validate_env.py \
            --file .env.test \
            --environment test
          cmp --silent .env.test .env.test.example

      - name: Validate shell scripts
        run: |
          find scripts -maxdepth 1 -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          find docker -maxdepth 1 -type f -name '*.sh' -print0 | xargs -0 -n1 sh -n

      - name: Lint
        run: ruff check .

      - name: Migration consistency
        run: python manage.py makemigrations --check --dry-run

      - name: Django check
        run: python manage.py check

      - name: Production security check
        env:
          DJANGO_ENV: production
          DJANGO_ENV_FILE: ""
          DEBUG: "0"
          SECRET_KEY: ci-only-production-check-secret-key-with-more-than-fifty-characters-2026
          ALLOWED_HOSTS: example.com
          CSRF_TRUSTED_ORIGINS: https://example.com
          SECURE_SSL_REDIRECT: "1"
          SESSION_COOKIE_SECURE: "1"
          CSRF_COOKIE_SECURE: "1"
          SECURE_HSTS_SECONDS: "31536000"
          SECURE_HSTS_INCLUDE_SUBDOMAINS: "1"
          SECURE_HSTS_PRELOAD: "1"
        run: python manage.py check --deploy --fail-level WARNING

      - name: Static assets check
        env:
          STATIC_ROOT: ${{ runner.temp }}/staticfiles
        run: python manage.py collectstatic --noinput --clear

      - name: Fast tests
        env:
          KEEP_TEST_DB: "0"
          TEST_PROCESSES: "2"
        run: ./scripts/test-fast.sh -v 2

      - name: Slow tests
        env:
          KEEP_TEST_DB: "0"
        run: ./scripts/test-slow.sh -v 2

  docker-build-check:
    name: Production Docker smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          file: ./Dockerfile
          pull: true
          push: false
          tags: cadet-journal:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Runtime image checks
        run: |
          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --entrypoint sh \
            cadet-journal:ci \
            -c 'test -f /app/staticfiles/staticfiles.json && test -x /entrypoint.sh && test -x /start-web.sh'

          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            -e DJANGO_ENV=test \
            -e DJANGO_ENV_FILE= \
            -e DEBUG=0 \
            -e SECRET_KEY=ci-only-runtime-secret-key-with-more-than-fifty-characters-2026 \
            -e ALLOWED_HOSTS=localhost \
            -e DB_ENGINE=django.db.backends.sqlite3 \
            -e DB_NAME=/tmp/runtime-check.sqlite3 \
            --entrypoint python \
            cadet-journal:ci \
            manage.py check

      - name: Production Compose smoke test
        env:
          RELEASE_REVISION: ci
        run: |
          cp .env.prod.example .env.prod
          python - <<'PY'
          from pathlib import Path

          path = Path('.env.prod')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'replace-with-a-random-secret-key-at-least-50-characters-long': (
                  'ci-production-secret-key-with-more-than-fifty-characters-2026'
              ),
              'example.com,www.example.com': 'localhost',
              'https://example.com,https://www.example.com': 'https://localhost',
              'replace-with-a-strong-database-password': 'ci-database-password-2026',
              'replace-with-a-strong-initial-admin-password': 'ci-admin-password-2026',
              'replace-with-a-separate-data-tools-password': 'ci-data-tools-password-2026',
              'APP_PORT=8000': 'APP_PORT=18000',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

          python scripts/validate_env.py --file .env.prod --environment production

          compose=(
            docker compose
            --env-file .env.prod
            -f docker-compose.yml
            -f docker-compose.prod.yml
          )
          cleanup() {
            "${compose[@]}" logs --tail 200 || true
            "${compose[@]}" down -v --remove-orphans || true
            rm -f .env.prod
          }
          trap cleanup EXIT

          "${compose[@]}" config --quiet
          "${compose[@]}" up -d --no-build --wait --wait-timeout 240
          curl --fail --silent --show-error \
            -H 'Host: localhost' \
            -H 'X-Forwarded-Proto: https' \
            http://127.0.0.1:18000/health/
          "${compose[@]}" exec -T web python manage.py check
          "${compose[@]}" exec -T redis redis-cli ping | grep -qx PONG

  ci-passed:
    name: Required CI result
    if: always()
    needs:
      - test
      - docker-build-check
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          TEST_RESULT: ${{ needs.test.result }}
          DOCKER_RESULT: ${{ needs.docker-build-check.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$DOCKER_RESULT" = success

  deploy-production:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - ci-passed
    permissions:
      contents: read
    uses: ./.github/workflows/cd.yml
    secrets: inherit
