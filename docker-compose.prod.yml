services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env.prod
    environment:
      REDIS_URL: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4.10-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    env_file:
      - .env.prod
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      BACKUP_INTERVAL_SECONDS: "86400"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pg_backups:/backups
      - ./docker/backup-postgres.sh:/usr/local/bin/backup-postgres:ro
    command: ["/usr/local/bin/backup-postgres", "--loop"]
    restart: unless-stopped

volumes:
  pg_backups:
