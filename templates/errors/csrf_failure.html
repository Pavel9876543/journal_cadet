<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма устарела</title>
    <style>
        * { box-sizing: border-box; }
        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            place-items: center;
            color: #172033;
            background: #f4f7fb;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        main {
            width: min(100%, 620px);
            padding: clamp(24px, 6vw, 42px);
            border: 1px solid #d7e0ec;
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 18px 48px rgba(27, 39, 59, 0.1);
        }
        h1 { margin: 0 0 12px; font-size: clamp(1.5rem, 5vw, 2rem); }
        p { margin: 0; color: #63738b; line-height: 1.6; }
        .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
        a {
            display: inline-flex;
            min-height: 44px;
            padding: 11px 16px;
            align-items: center;
            justify-content: center;
            border: 1px solid #1f6fb2;
            border-radius: 8px;
            color: #fff;
            background: #1f6fb2;
            font-weight: 700;
            text-decoration: none;
        }
        a.secondary { color: #164b7b; background: #fff; }
        @media (max-width: 480px) {
            body { padding: 10px; }
            .actions, a { width: 100%; }
        }
    </style>
</head>
<body>
    <main>
        <h1>Срок действия формы истёк</h1>
        <p>{{ message }}</p>
        <div class="actions">
            <a href="{{ retry_url }}">Обновить страницу</a>
            <a class="secondary" href="{% url 'journal' %}">На главную</a>
        </div>
    </main>
</body>
</html>
